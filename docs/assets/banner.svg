<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200" style="background:#0d1117;border-radius:8px">
  <defs>
    <linearGradient id="radgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00FF9D" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Radar Grid -->
  <g opacity="0.15" stroke="#00E5FF" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
    <line x1="250" y1="0" x2="250" y2="200"/>
    <line x1="350" y1="0" x2="350" y2="200"/>
    <line x1="450" y1="0" x2="450" y2="200"/>
    <line x1="550" y1="0" x2="550" y2="200"/>
    <line x1="650" y1="0" x2="650" y2="200"/>
    <line x1="750" y1="0" x2="750" y2="200"/>
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
  </g>

  <!-- Radar Scope Graphic on Left -->
  <circle cx="100" cy="100" r="75" fill="url(#glow)"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.6"/>
  <circle cx="100" cy="100" r="45" fill="none" stroke="#00FF9D" stroke-width="1" opacity="0.4" stroke-dasharray="4,4"/>
  <circle cx="100" cy="100" r="20" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="25" x2="100" y2="175" stroke="#00E5FF" stroke-width="1" opacity="0.4"/>
  <line x1="25" y1="100" x2="175" y2="100" stroke="#00E5FF" stroke-width="1" opacity="0.4"/>

  <!-- Radar Sweep Line -->
  <line x1="100" y1="100" x2="150" y2="50" stroke="#00FF9D" stroke-width="2" opacity="0.8"/>
  <circle cx="140" cy="65" r="3.5" fill="#00FF9D"/>
  <circle cx="70" cy="125" r="2.5" fill="#00E5FF"/>
  <circle cx="115" cy="135" r="3" fill="#FF5252"/>

  <!-- Typography -->
  <text x="210" y="75" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="800" font-size="34" fill="#00E5FF" letter-spacing="1">
    k-packet-radar
  </text>
  <text x="210" y="105" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="16" fill="#00FF9D">
    Non-Invasive UDP 6112 Packet Parser &amp; Tactical Radar HUD Engine
  </text>
  <text x="210" y="135" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="400" font-size="13" fill="#8b949e">
    Zero Process Mutation · Real-Time Latency Metrics · Anti-Cheat Safe · 8.0+ Mpps Zero-Copy Throughput
  </text>

  <!-- Tag Pills -->
  <g transform="translate(210, 150)">
    <rect x="0" y="0" width="75" height="22" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="12" y="15" font-family="monospace" font-size="11" fill="#c9d1d9">Rust Core</text>

    <rect x="85" y="0" width="85" height="22" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="97" y="15" font-family="monospace" font-size="11" fill="#00E5FF">UDP 6112</text>

    <rect x="180" y="0" width="95" height="22" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="192" y="15" font-family="monospace" font-size="11" fill="#00FF9D">Direct2D HUD</text>

    <rect x="285" y="0" width="105" height="22" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="297" y="15" font-family="monospace" font-size="11" fill="#7C4DFF">Zero-Zombie</text>
  </g>
</svg>
