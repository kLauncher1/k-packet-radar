    <text x="0" y="86" fill="#00E5FF">===============================================================</text>
    <text x="0" y="112" fill="#58a6ff">[*] تهيئة خط معالجة الحزم الاصطناعية وشبكة الرادار...</text>
    <text x="0" y="134" fill="#00FF9D">[+] تم إجراء تسلسل لحزمة العينة (24 بايت)</text>
    <text x="0" y="156" fill="#00FF9D">[+] تم تحليل الحزمة بنجاح: التسلسل=1042، اللاعب=1، الإجراءات=2</text>
    <text x="0" y="178" fill="#e3b341">[+] قياس اللاعب 1: حزم=3، RTT=28.7ms، التذبذب=1.2ms</text>
    <text x="0" y="200" fill="#00E5FF">[+] حالة الأمان: نظيف (0 إغراق / 0 عدم تزامن)</text>
