<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" style="background:#0b0f14;border-radius:8px;font-family:'Cascadia Code', 'JetBrains Mono', Consolas, monospace">
  <rect x="0" y="0" width="800" height="36" fill="#161b22" rx="8" ry="8"/>
  <rect x="0" y="24" width="800" height="12" fill="#161b22"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="18" r="6" fill="#27c93f"/>
  <text x="400" y="22" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="600">k-packet-radar — टर्मिनल निष्पादन कैप्चर — 80x24</text>

  <g transform="translate(24, 60)" font-size="12.5" line-height="1.5">
    <text x="0" y="0" fill="#00FF9D">PS C:\k-packet-radar&gt; </text>
    <text x="180" y="0" fill="#f0f6fc">cargo run -- demo</text>
    <text x="0" y="26" fill="#00E5FF">===============================================================</text>
    <text x="0" y="46" fill="#00E5FF" font-weight="bold">   k-packet-radar: गैर-आक्रामक UDP 6112 सामरिक इंजन</text>
    <text x="0" y="66" fill="#8b949e">   उच्च प्रदर्शन स्टारक्राफ्ट पैकेट स्निफर और टेलीमेट्री HUD</text>
    <text x="0" y="86" fill="#00E5FF">===============================================================</text>
    <text x="0" y="112" fill="#58a6ff">[*] सिंथेटिक पैकेट पाइपलाइन और रडार ग्रिड प्रारंभ हो रहा है...</text>
    <text x="0" y="134" fill="#00FF9D">[+] नमूना पैकेट क्रमबद्ध किया गया (24 बाइट्स)</text>
    <text x="0" y="156" fill="#00FF9D">[+] पैकेट सफलतापूर्वक पार्स किया गया: क्रम=1042, खिलाड़ी=1, क्रियाएं=2</text>
    <text x="0" y="178" fill="#e3b341">[+] खिलाड़ी 1 टेलीमेट्री: पैकेट=3, RTT=28.7ms, जिटर=1.2ms</text>
    <text x="0" y="200" fill="#00E5FF">[+] विसंगति स्थिति: स्वच्छ (0 बाढ़ / 0 डिसिंक / 0 ड्रॉपहैक)</text>
    <text x="0" y="222" fill="#58a6ff">[+] रडार ने 4 सामरिक वस्तुओं को अनुक्रमित किया।</text>
    <text x="0" y="248" fill="#8b949e">[+] ASCII सामरिक मिनी-मैप पूर्वावलोकन (32x12):</text>
    <text x="0" y="268" fill="#00FF9D" xml:space="preserve">    w...............................</text>
    <text x="0" y="286" fill="#00E5FF" xml:space="preserve">    .........u......................</text>
    <text x="0" y="304" fill="#7C4DFF" xml:space="preserve">    ...............a................</text>
    <text x="0" y="322" fill="#FFB300" xml:space="preserve">    ...........................B....</text>
    <text x="0" y="352" fill="#00FF9D" font-weight="bold">>>> शून्य त्रुटियों के साथ डेमो पूर्ण · थ्रूपुट: 8.44 Mpps</text>
  </g>
</svg>