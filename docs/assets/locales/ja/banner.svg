<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" style="background:#0d1117;border-radius:8px">
  <defs>
    <radialGradient id="glow-ja" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Radar Grid -->
  <g opacity="0.15" stroke="#00E5FF" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
    <line x1="250" y1="0" x2="250" y2="200"/>
    <line x1="350" y1="0" x2="350" y2="200"/>
    <line x1="450" y1="0" x2="450" y2="200"/>
    <line x1="550" y1="0" x2="550" y2="200"/>
    <line x1="650" y1="0" x2="650" y2="200"/>
    <line x1="750" y1="0" x2="750" y2="200"/>
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
  </g>

  <!-- Radar Scope Graphic on Left -->
  <circle cx="100" cy="100" r="75" fill="url(#glow-ja)"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.6"/>
  <circle cx="100" cy="100" r="45" fill="none" stroke="#00FF9D" stroke-width="1" opacity="0.4" stroke-dasharray="4,4"/>
  <circle cx="100" cy="100" r="20" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="25" x2="100" y2="175" stroke="#00E5FF" stroke-width="1" opacity="0.4"/>
  <line x1="25" y1="100" x2="175" y2="100" stroke="#00E5FF" stroke-width="1" opacity="0.4"/>
  <line x1="100" y1="100" x2="150" y2="50" stroke="#00FF9D" stroke-width="2" opacity="0.8"/>
  <circle cx="140" cy="65" r="3.5" fill="#00FF9D"/>
  <circle cx="70" cy="125" r="2.5" fill="#00E5FF"/>
  <circle cx="115" cy="135" r="3" fill="#FF5252"/>

  <!-- Typography -->
  <text x="210" y="70" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="800" font-size="32" fill="#00E5FF" letter-spacing="1">
    k-packet-radar
  </text>
  <text x="210" y="100" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="15" fill="#00FF9D">
    非侵襲的 UDP 6112 パケットパーサー＆リアルタイム戦術レーダー HUD
  </text>
  <text x="210" y="130" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="400" font-size="12" fill="#8b949e">
    プロセス改変ゼロ · リアルタイム遅延計測 · アンチチートセーフ · 8.0+ Mpps 処理能力
  </text>

  <!-- Tag Pills -->
  <g transform="translate(210, 146)">
    <rect x="0" y="0" width="85" height="24" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="10" y="16" font-family="'Segoe UI', monospace" font-size="11" fill="#c9d1d9">Rust コア</text>

    <rect x="95" y="0" width="90" height="24" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="105" y="16" font-family="'Segoe UI', monospace" font-size="11" fill="#00E5FF">UDP 6112</text>

    <rect x="195" y="0" width="130" height="24" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="205" y="16" font-family="'Segoe UI', monospace" font-size="11" fill="#00FF9D">決定論的 60 FPS</text>

    <rect x="335" y="0" width="105" height="24" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="345" y="16" font-family="'Segoe UI', monospace" font-size="11" fill="#FFB300">非侵襲的</text>
  </g>
</svg>