<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="420" style="background:#090d13;border-radius:8px;font-family:'Segoe UI', monospace, sans-serif">
  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="32" fill="#111822"/>
  <circle cx="16" cy="16" r="5" fill="#00E5FF"/>
  <text x="32" y="21" font-size="12" fill="#00E5FF" font-weight="bold">DIRECT2D 60FPS HUD オーバーレイ — 非侵襲的パケットテレメトリ</text>
  <text x="780" y="21" font-size="11" fill="#00FF9D" text-anchor="end">ライブ UDP 6112</text>

  <!-- Left: Circular Radar Matrix -->
  <g transform="translate(20, 48)">
    <rect x="0" y="0" width="350" height="350" rx="6" fill="#0d131a" stroke="#1f2a38"/>
    <circle cx="175" cy="175" r="140" fill="none" stroke="#00E5FF" stroke-width="1.2" opacity="0.3"/>
    <circle cx="175" cy="175" r="95" fill="none" stroke="#00FF9D" stroke-width="1" opacity="0.25" stroke-dasharray="4,4"/>
    <circle cx="175" cy="175" r="50" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.2"/>
    <line x1="175" y1="20" x2="175" y2="330" stroke="#00E5FF" stroke-width="1" opacity="0.2"/>
    <line x1="20" y1="175" x2="330" y2="175" stroke="#00E5FF" stroke-width="1" opacity="0.2"/>

    <!-- Player 1 Base &amp; Units -->
    <circle cx="70" cy="70" r="8" fill="#00E5FF" opacity="0.9"/>
    <text x="82" y="74" font-size="10" fill="#00E5FF">ネクサス</text>
    <circle cx="85" cy="60" r="3.5" fill="#00FF9D"/>
    <circle cx="60" cy="85" r="3.5" fill="#00FF9D"/>
    <circle cx="95" cy="85" r="3.5" fill="#00FF9D"/>

    <!-- Center Combat Engagement -->
    <circle cx="165" cy="165" r="5" fill="#00E5FF"/>
    <circle cx="175" cy="160" r="5" fill="#00E5FF"/>
    <circle cx="185" cy="170" r="5.5" fill="#7C4DFF"/>
    <text x="195" y="174" font-size="9" fill="#7C4DFF">オブザーバー</text>

    <!-- Player 2 Base &amp; Units -->
    <circle cx="280" cy="280" r="8" fill="#FFB300" opacity="0.9"/>
    <text x="210" y="284" font-size="10" fill="#FFB300">コマンドセンター</text>
    <circle cx="270" cy="290" r="3.5" fill="#FFB300"/>
    <circle cx="290" cy="270" r="3.5" fill="#FFB300"/>
    <circle cx="195" cy="190" r="5" fill="#FF5252"/>
    <circle cx="205" cy="195" r="5" fill="#FF5252"/>

    <text x="12" y="338" font-size="10" fill="#8b949e">グリッド: 256x256 · マップ: 闘魂 (Fighting Spirits)</text>
  </g>

  <!-- Right: Real-time Telemetry Dashboard -->
  <g transform="translate(390, 48)">
    <rect x="0" y="0" width="390" height="350" rx="6" fill="#0d131a" stroke="#1f2a38"/>
    <text x="20" y="30" font-size="14" fill="#00E5FF" font-weight="bold">試合テレメトリ＆ネットワーク状態</text>
    <line x1="20" y1="42" x2="370" y2="42" stroke="#1f2a38" stroke-width="1"/>

    <!-- Player 1 Card -->
    <g transform="translate(20, 56)">
      <rect x="0" y="0" width="350" height="74" rx="4" fill="#141c26" stroke="#00E5FF" stroke-width="0.8"/>
      <text x="14" y="24" font-size="13" fill="#00E5FF" font-weight="bold">プレイヤー 1: Ken Park [プロトス]</text>
      <text x="14" y="46" font-size="11" fill="#c9d1d9">RTT 遅延: <tspan fill="#00FF9D" font-weight="bold">18.4 ms</tspan> · ジッター: <tspan fill="#00FF9D">0.6 ms</tspan> · パケット数: 1,420</text>
      <text x="14" y="64" font-size="11" fill="#8b949e">推定 APM: 324 · Sequence Gap: 0 (パケット損失: 0.0%)</text>
    </g>

    <!-- Player 2 Card -->
    <g transform="translate(20, 142)">
      <rect x="0" y="0" width="350" height="74" rx="4" fill="#141c26" stroke="#FFB300" stroke-width="0.8"/>
      <text x="14" y="24" font-size="13" fill="#FFB300" font-weight="bold">プレイヤー 2: 対戦相手 [テラン]</text>
      <text x="14" y="46" font-size="11" fill="#c9d1d9">RTT 遅延: <tspan fill="#FFB300" font-weight="bold">24.1 ms</tspan> · ジッター: <tspan fill="#FFB300">1.1 ms</tspan> · パケット数: 1,418</text>
      <text x="14" y="64" font-size="11" fill="#8b949e">推定 APM: 288 · Sequence Gap: 0 (パケット損失: 0.0%)</text>
    </g>

    <!-- Sentinel Banner -->
    <g transform="translate(20, 230)">
      <rect x="0" y="0" width="350" height="42" rx="4" fill="#0f291e" stroke="#00FF9D" stroke-width="0.8"/>
      <circle cx="16" cy="21" r="5" fill="#00FF9D"/>
      <text x="28" y="25" font-size="10.5" fill="#00FF9D" font-weight="bold">セキュリティ番犬: ドロップハック監視稼働中 · 0 非同期</text>
    </g>
  </g>
</svg>