  <circle cx="38" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="18" r="6" fill="#27c93f"/>
  <text x="400" y="22" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="600">k-packet-radar — 파워쉘 실행 캡처 — 80x24</text>

  <g transform="translate(24, 60)" font-size="12.5" line-height="1.5">
    <text x="0" y="0" fill="#00FF9D">PS C:\k-packet-radar&gt; </text>
    <text x="180" y="0" fill="#f0f6fc">cargo run -- demo</text>
    <text x="0" y="26" fill="#00E5FF">===============================================================</text>
    <text x="0" y="46" fill="#00E5FF" font-weight="bold">   k-packet-radar: 비침습적 UDP 6112 전술 레이더 엔진</text>
    <text x="0" y="66" fill="#8b949e">   초고속 스타크래프트 패킷 스니퍼 &amp; 실시간 텔레메트리 HUD</text>
    <text x="0" y="86" fill="#00E5FF">===============================================================</text>
    <text x="0" y="112" fill="#58a6ff">[*] 가상 패킷 파이프라인 및 레이더 매트릭스 초기화 중...</text>
    <text x="0" y="134" fill="#00FF9D">[+] 샘플 패킷 직렬화 완료 (24 바이트)</text>
