    <text x="0" y="178" fill="#e3b341">[+] 플레이어 1 텔레메트리: 패킷=3, RTT=28.7ms, 지터=1.2ms</text>
    <text x="0" y="200" fill="#00E5FF">[+] 이상 징후 상태: 정상 (0 플러딩 / 0 디싱크 / 0 드랍핵)</text>
    <text x="0" y="222" fill="#58a6ff">[+] 전술 레이더 오브젝트 4개 인덱싱 완료.</text>
    <text x="0" y="248" fill="#8b949e">[+] ASCII 전술 미니맵 미리보기 (32x12):</text>
    <text x="0" y="268" fill="#00FF9D" xml:space="preserve">    w...............................</text>
    <text x="0" y="286" fill="#00E5FF" xml:space="preserve">    .........u......................</text>
    <text x="0" y="304" fill="#7C4DFF" xml:space="preserve">    ...............a................</text>
    <text x="0" y="322" fill="#FFB300" xml:space="preserve">    ...........................B....</text>
    <text x="0" y="352" fill="#00FF9D" font-weight="bold">>>> 데모 실행 완료 (오류 0건) · 처리량: 8.44 Mpps (118.4 ns/pkt)</text>
