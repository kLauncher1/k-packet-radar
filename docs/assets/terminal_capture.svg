<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="450" style="background:#0b0f14;border-radius:8px;font-family:'Cascadia Code', 'JetBrains Mono', Consolas, monospace">
  <!-- Window Titlebar -->
  <rect x="0" y="0" width="800" height="36" fill="#161b22" rx="8" ry="8"/>
  <rect x="0" y="24" width="800" height="12" fill="#161b22"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="18" r="6" fill="#27c93f"/>
  <text x="400" y="22" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="600">k-packet-radar — powershell — 80x24</text>

  <!-- Terminal Content Area -->
  <g transform="translate(24, 60)" font-size="12.5" line-height="1.5">
    <!-- Command Prompt -->
    <text x="0" y="0" fill="#00FF9D">PS C:\k-packet-radar&gt; </text>
    <text x="180" y="0" fill="#f0f6fc">cargo run -- demo</text>

    <!-- Banner -->
    <text x="0" y="26" fill="#00E5FF">===============================================================</text>
    <text x="0" y="46" fill="#00E5FF" font-weight="bold">   k-packet-radar: Non-Invasive UDP 6112 Tactical Engine</text>
    <text x="0" y="66" fill="#8b949e">   High-performance StarCraft packet sniffer &amp; telemetry HUD</text>
    <text x="0" y="86" fill="#00E5FF">===============================================================</text>

    <!-- Telemetry & Actions -->
    <text x="0" y="112" fill="#58a6ff">[*] Initializing synthetic packet pipeline &amp; radar grid...</text>
    <text x="0" y="134" fill="#00FF9D">[+] Serialized sample packet (24 bytes)</text>
    <text x="0" y="156" fill="#00FF9D">[+] Successfully parsed packet: seq=1042, player=1, actions=2</text>
    <text x="0" y="178" fill="#e3b341">[+] Player 1 Telemetry: packets=3, RTT=28.7ms, Jitter=1.2ms</text>
    <text x="0" y="200" fill="#00E5FF">[+] Anomaly status: Clean (0 flood / 0 desync / 0 drophack)</text>
    <text x="0" y="222" fill="#58a6ff">[+] Radar indexed 4 tactical objects.</text>

    <!-- ASCII Radar Grid -->
    <text x="0" y="248" fill="#8b949e">[+] ASCII Tactical Mini-Map Preview (32x12):</text>
    <text x="0" y="268" fill="#00FF9D" xml:space="preserve">    w...............................</text>
    <text x="0" y="286" fill="#00E5FF" xml:space="preserve">    .........u......................</text>
    <text x="0" y="304" fill="#7C4DFF" xml:space="preserve">    ...............a................</text>
    <text x="0" y="322" fill="#FFB300" xml:space="preserve">    ...........................B....</text>

    <!-- Benchmark Note -->
    <text x="0" y="352" fill="#00FF9D" font-weight="bold">&gt;&gt;&gt; Demo completed with zero errors · Throughput: 8.44 Mpps (118.4 ns/pkt)</text>
  </g>
</svg>
